<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="description" content="UniiChat: the one chat you keep forever. It never forgets.">
<title>UniiChat</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0b0b0d">
<!-- the theme picked in the menu (main.tsx theme_swap), dark unless light, set before the page paints -->
<script>document.documentElement.dataset.theme="dark";try{if(localStorage.getItem("unii.theme")==="light"){document.documentElement.dataset.theme="light";document.querySelector('meta[name="theme-color"]').content="#f6f5f2"}}catch{}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UniiChat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Bricolage Grotesque (titles) and IBM Plex Sans and Mono (text, code); offline, the system's -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body class="guest">
<!-- the page, drawn by React (web/src/main.tsx) -->
<div id="root"></div>
</body>
</html>
