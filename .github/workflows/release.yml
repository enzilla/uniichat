name: release

# A push to main publishes a release when the tree since the last
# vX.Y.Z tag ships (scripts/ci/Release.ts, the vortex classifier; with
# the JEV_API_KEY secret, Jev judges the diff as vortex does, else the
# commits' types decide). The tag is strict vX.Y.Z. The first one, with no such
# tag yet, is v31.1.0. CI-only, test-only and doc-only pushes do not
# publish. The Linux builds (arm64, x64), their installer and
# SHA256SUMS come from that tag. `unii update` installs
# /releases/latest/download, so the tag shape is not in the URL.
# infra-pi is told (repository_dispatch uniichat-published) and pins
# UNII_VERSION and UNII_INSTALL_SHA256 in its shared deploy PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun test
      # Jev (vortex's pin), only when its key is set: without it the
      # commits' types decide (scripts/ci/next-version.ts). The key itself
      # reaches only the step that asks Jev
      - name: Jev key
        id: jev
        run: echo "set=${{ secrets.JEV_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: install Jev
        if: steps.jev.outputs.set == 'true'
        env:
          JEV_VERSION: v2026.919.0
          JEV_INSTALL_DIR: ${{ runner.temp }}/jev-bin
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/model-clis/jev/v2026.919.0/scripts/install.sh | sh
          echo "$JEV_INSTALL_DIR" >> "$GITHUB_PATH"
          "$JEV_INSTALL_DIR/jev" --version
      - name: next version
        id: ver
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -eu
          ver="$(bun scripts/ci/next-version.ts)"
          case "$ver" in
            none) ;;
            v*.*.*)
              printf '%s' "$ver" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
                echo "refusing tag $ver" >&2
                exit 1
              }
              ;;
            *) echo "refusing tag $ver" >&2; exit 1 ;;
          esac
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: build
        id: build
        if: steps.ver.outputs.ver != 'none'
        run: |
          set -eu
          ver="${{ steps.ver.outputs.ver }}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          sed -i 's/^export const VERSION = ".*";$/export const VERSION = "'"$ver"'";/' Update.ts
          mkdir -p dist
          for arch in arm64 x64; do
            mkdir -p "dist/$arch"
            bun Build.ts "bun-linux-$arch" "dist/$arch/unii"
            tar -czf "dist/unii-$ver-linux-$arch.tar.gz" -C "dist/$arch" unii
          done
          sum() { sha256sum "dist/unii-$ver-linux-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VER@/$ver/" -e "s/@SUM_ARM64@/$(sum arm64)/" -e "s/@SUM_X64@/$(sum x64)/" release/install.sh > dist/install.sh
          (cd dist && sha256sum unii-*.tar.gz install.sh > SHA256SUMS)
      - name: release
        if: steps.ver.outputs.ver != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.build.outputs.ver }}
        run: |
          set -eu
          inst="$(sha256sum dist/install.sh | cut -d' ' -f1)"
          printf 'unii %s (enzilla fork), from %s.\n\nFor pi-infra (compose/versions.env):\n\n    UNII_VERSION=%s\n    UNII_INSTALL_SHA256=%s\n' "$VER" "$GITHUB_SHA" "$VER" "$inst" > dist/notes.md
          gh release create "$VER" --target "$GITHUB_SHA" --title "$VER" --notes-file dist/notes.md dist/install.sh dist/SHA256SUMS dist/unii-*.tar.gz
      # infra-pi pins it in its shared PR (deploy/application-images), as
      # the Vortex images do: a repository_dispatch with a fine-grained
      # token limited to that repository (INFRA_PI_DISPATCH_TOKEN). infra-pi
      # computes the installer's sha256 itself; this one is for its log
      - name: notify infra-pi
        if: steps.ver.outputs.ver != 'none'
        env:
          TOKEN: ${{ secrets.INFRA_PI_DISPATCH_TOKEN }}
          VER: ${{ steps.build.outputs.ver }}
        run: |
          set -eu
          if [ -z "$TOKEN" ]; then
            echo "INFRA_PI_DISPATCH_TOKEN is missing: infra-pi won't pin $VER by itself" >&2
            exit 1
          fi
          inst="$(sha256sum dist/install.sh | cut -d' ' -f1)"
          jq -n --arg tag "$VER" --arg revision "$GITHUB_SHA" --arg sum "$inst" \
            '{event_type:"uniichat-published",client_payload:{revision:$revision,updates:{UNII_VERSION:$tag,UNII_INSTALL_SHA256:$sum}}}' |
            curl -fsS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/enzolaOps/infra-pi/dispatches \
              --data @-
