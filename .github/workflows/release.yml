name: release

# A push to main publishes a release when the tree since the last
# vX.Y.Z tag ships (scripts/ci/Release.ts, the vortex classifier
# without Jev). The tag is strict vX.Y.Z. The first one, with no such
# tag yet, is v31.1.0. CI-only, test-only and doc-only pushes do not
# publish. The Linux builds (arm64, x64), their installer and
# SHA256SUMS come from that tag. `unii update` installs
# /releases/latest/download, so the tag shape is not in the URL.
# pi-infra pins UNII_VERSION and UNII_INSTALL_SHA256.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: next version
        id: ver
        run: |
          set -eu
          ver="$(bun scripts/ci/next-version.ts)"
          case "$ver" in
            none) ;;
            v*.*.*)
              printf '%s' "$ver" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
                echo "refusing tag $ver" >&2
                exit 1
              }
              ;;
            *) echo "refusing tag $ver" >&2; exit 1 ;;
          esac
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: build
        id: build
        if: steps.ver.outputs.ver != 'none'
        run: |
          set -eu
          ver="${{ steps.ver.outputs.ver }}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          sed -i 's/^export const VERSION = ".*";$/export const VERSION = "'"$ver"'";/' Update.ts
          mkdir -p dist
          for arch in arm64 x64; do
            mkdir -p "dist/$arch"
            bun Build.ts "bun-linux-$arch" "dist/$arch/unii"
            tar -czf "dist/unii-$ver-linux-$arch.tar.gz" -C "dist/$arch" unii
          done
          sum() { sha256sum "dist/unii-$ver-linux-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VER@/$ver/" -e "s/@SUM_ARM64@/$(sum arm64)/" -e "s/@SUM_X64@/$(sum x64)/" release/install.sh > dist/install.sh
          (cd dist && sha256sum unii-*.tar.gz install.sh > SHA256SUMS)
      - name: release
        if: steps.ver.outputs.ver != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.build.outputs.ver }}
        run: |
          set -eu
          inst="$(sha256sum dist/install.sh | cut -d' ' -f1)"
          printf 'unii %s (enzilla fork), from %s.\n\nFor pi-infra (compose/versions.env):\n\n    UNII_VERSION=%s\n    UNII_INSTALL_SHA256=%s\n' "$VER" "$GITHUB_SHA" "$VER" "$inst" > dist/notes.md
          gh release create "$VER" --target "$GITHUB_SHA" --title "$VER" --notes-file dist/notes.md dist/install.sh dist/SHA256SUMS dist/unii-*.tar.gz
