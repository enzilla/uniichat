name: release

# Every push to main is a release: the Linux builds (arm64, x64), their
# installer (release/install.sh, the sums written in) and SHA256SUMS,
# tagged <Update.ts VERSION>.<run number>. `unii update` and pi-infra's
# deploy (UNII_VERSION, UNII_INSTALL_SHA256 in compose/versions.env)
# install from it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: build
        id: build
        run: |
          set -eu
          ver="$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' Update.ts).${GITHUB_RUN_NUMBER}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for arch in arm64 x64; do
            mkdir -p "dist/$arch"
            bun Build.ts "bun-linux-$arch" "dist/$arch/unii"
            tar -czf "dist/unii-$ver-linux-$arch.tar.gz" -C "dist/$arch" unii
          done
          sum() { sha256sum "dist/unii-$ver-linux-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VER@/$ver/" -e "s/@SUM_ARM64@/$(sum arm64)/" -e "s/@SUM_X64@/$(sum x64)/" release/install.sh > dist/install.sh
          (cd dist && sha256sum unii-*.tar.gz install.sh > SHA256SUMS)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.build.outputs.ver }}
        run: |
          set -eu
          inst="$(sha256sum dist/install.sh | cut -d' ' -f1)"
          printf 'unii %s (enzilla fork), from %s.\n\nFor pi-infra (compose/versions.env):\n\n    UNII_VERSION=%s\n    UNII_INSTALL_SHA256=%s\n' "$VER" "$GITHUB_SHA" "$VER" "$inst" > dist/notes.md
          gh release create "$VER" --target "$GITHUB_SHA" --title "$VER" --notes-file dist/notes.md dist/install.sh dist/SHA256SUMS dist/unii-*.tar.gz
